<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="consentia-agenda-version" content="1.8.0">

<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">

<title>Agenda · Consentía Studio</title>
<!-- Consentía Studio · agenda en el móvil (solo consulta).
     Las agendas están cifradas: esta página las descarga de GitHub y las descifra AQUÍ, en el navegador,
     con la contraseña que escribes. La contraseña no se envía a ningún sitio. -->
<style>
:root{--ink:#111113;--pink:#ff2b91;--muted:#77736c;--line:#e4e0d8;--bg:#f4f2ee;--good:#1d8a4a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5}
header .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{letter-spacing:.14em;font-size:13px;text-transform:uppercase}
header button{background:transparent;color:#fff;border:1px solid #444;border-radius:4px;padding:6px 10px;font:inherit;font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.tabs button{flex:none;background:#26262a;color:#ddd;border:0;border-radius:16px;padding:6px 12px;font:inherit;font-size:13px}
.tabs button.on{background:var(--pink);color:#fff}
.days{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:var(--hh,56px);z-index:4}
.days button{background:#fff;border:1px solid var(--line);border-radius:4px;min-width:40px;height:36px;font:inherit;font-size:16px}
.days .d{flex:1;text-align:center;font-weight:700}
.days .hoy{font-size:12px;min-width:auto;padding:0 10px}
main{padding:10px 12px 40px;max-width:720px;margin:0 auto}
.emp{background:#fff;border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
.emp h3{margin:0;padding:9px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.it{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid #f0ede7;border-left:4px solid var(--c,#999)}
.it:last-child{border-bottom:0}
.it .h{font:700 13px ui-monospace,Consolas,monospace;white-space:nowrap;min-width:92px}
.it .w b{display:block}.it .w small{color:var(--muted)}
.it.x{opacity:.5}.it.x b{text-decoration:line-through}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.tag.c{background:#e3f4e9;color:var(--good)}.tag.x{background:#eee;color:#555}.tag.n{background:#fde4ec;color:#a3164c}
.blk{background:repeating-linear-gradient(135deg,#111 0 7px,#2b2b2b 7px 14px);color:#fff;border-left-color:#000}
.blk .w b{text-transform:uppercase;letter-spacing:.1em}
.none{color:var(--muted);padding:10px 12px;font-size:13px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:14px 0}
.warn{background:#fff4d6;border:1px solid #ecd18c;color:#5c3d00;border-radius:6px;padding:10px 12px;margin:10px 0;font-size:13px}
.bad{background:#fde4ec;border:1px solid #eeb3c4;color:#6d0a28;border-radius:6px;padding:10px 12px;margin:10px 0;font-size:13px}
.login{max-width:380px;margin:12vh auto 0;padding:24px 20px;background:#fff;border:1px solid var(--line);border-radius:8px}
.login h1{font-size:20px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}
.login p{color:var(--muted);font-size:13px;margin:0 0 16px}
.login input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid #bdb9b1;border-radius:6px}
.login label{display:flex;gap:8px;align-items:center;font-size:13px;margin:12px 0;color:#444}
.login button{width:100%;background:var(--pink);color:#fff;border:0;border-radius:6px;padding:13px;font:inherit;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.login button[disabled]{opacity:.6}
.status{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:8px 0}
.status span{flex:1;min-width:0}
.status button{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;padding:5px 9px;font:inherit;font-size:12px;font-weight:700}
.status button.lnk{border:0;background:none;padding:0;text-decoration:underline;font-weight:700}
/* Vista en columnas, como la agenda del programa: una columna por trabajadora y las horas hacia abajo. */
main.wide{max-width:none;padding:0}
main.wide .warn,main.wide .bad{margin:8px 12px}
main.wide .status{margin:6px 12px}
.gw{overflow:auto;background:#fff;border-top:1px solid var(--line);overscroll-behavior:contain}
.g{display:grid;position:relative;min-width:100%}
.gc,.gh{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--ink)}
.gc{left:0;z-index:8}
.gh{z-index:6;border-left:1px solid #e7e3dc;padding:7px 8px;min-height:48px;display:flex;gap:6px;align-items:flex-start;min-width:0}
.gh .dot{margin-top:3px}
.gh div{min-width:0}
.gh b{display:block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh small{display:block;font-size:10px;font-weight:700;color:var(--muted);line-height:1.25}
.gh small.cl{display:inline-block;background:#111;color:#fff;text-transform:uppercase;letter-spacing:.1em;font-weight:900;padding:1px 5px;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt{position:sticky;left:0;z-index:5;background:#faf9f6;border-right:1px solid var(--line)}
.gt span{position:absolute;right:5px;font:700 10px ui-monospace,Consolas,monospace;color:#8a867e;transform:translateY(-6px)}
.gcol{position:relative;border-left:1px solid #e7e3dc}
.gcol .ln{position:absolute;left:0;right:0;border-top:1px solid #f0ede7}
.gcol .ln.hr{border-top-color:#ddd9d1}
.gcol .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#f3f1ec 0 6px,#ebe8e1 6px 12px)}
.gcol .bk{position:absolute;left:2px;right:2px;background:repeating-linear-gradient(135deg,#111 0 7px,#2b2b2b 7px 14px);border:1px solid #000;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:2}
.gcol .bk span{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;background:#111;padding:2px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap{position:absolute;border-left:4px solid var(--c,#ff2b91);background:linear-gradient(var(--bg,#ffe3f0),var(--bg,#ffe3f0)),#fff;padding:3px 5px 2px;font-size:11px;line-height:1.2;overflow:hidden;z-index:3;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.ap b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .t{display:block;font:700 9.5px ui-monospace,Consolas,monospace;color:#56534e;white-space:nowrap;overflow:hidden}
.ap .s{display:block;color:#44423d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap.done{background:repeating-linear-gradient(135deg,var(--bg) 0 8px,rgba(255,255,255,.55) 8px 16px),#fff}
.ap.done>*{opacity:.66}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--pink);z-index:4;pointer-events:none}
.sheetBack{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(17,17,19,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:72vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:2px 0;font-size:19px}
.sheet .h{font:700 13px ui-monospace,Consolas,monospace;color:#56534e}
.sheet p{margin:8px 0 0}
.sheet .who{color:var(--muted);font-size:13px}
.sheet .row{padding:9px 0;border-bottom:1px solid #f0ede7}
.sheet button{width:100%;margin-top:14px;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:12px;font:inherit;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.other{display:flex;gap:6px;margin-top:8px}.other input{flex:1;font:inherit;padding:8px;border:1px solid #bdb9b1;border-radius:4px}.other button{border:0;background:var(--ink);color:#fff;border-radius:4px;padding:0 12px;font:inherit}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var FORMAT = 'consentia-agenda-1', MIN_ITER = 100000, MAX_ITER = 5000000, BR_RE = /^agenda-[0-9a-f]{16,64}$/, SHA_RE = /^[0-9a-f]{40,64}$/, LS_BR = 'consentia-agenda-ramas', LS_VW = 'consentia-agenda-vista';
  var PX = 1.2, COL_W = 112, TIME_W = 42; // píxeles por minuto, ancho mínimo de cada columna y de la columna de las horas
  var app = document.getElementById('app');
  // Repositorio: https://USUARIO.github.io/REPOSITORIO/ (o ?repo=usuario/nombre solo en este ordenador, para pruebas).
  var cfg = (function () {
    var q = new URLSearchParams(location.search), h = location.hostname, seg = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/i.test(h) && seg.length) return { repo: h.split('.')[0] + '/' + seg[0], api: 'https://api.github.com', raw: 'https://raw.githubusercontent.com' };

    return { repo: q.get('repo') || '', api: q.get('api') || 'https://api.github.com', raw: q.get('raw') || 'https://raw.githubusercontent.com' };
  })();
  // Esta página nunca usa «service workers»: si alguien hubiera instalado uno, se quita.
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { var here = location.origin + '/' + (location.pathname.split('/').filter(Boolean)[0] || '') + '/'; rs.forEach(function (r) { if (r.scope === location.origin + '/' || r.scope.indexOf(here) === 0) r.unregister(); }); }).catch(function () { }); } catch (e) { }
  // pws: contraseñas escritas en esta visita (solo en memoria). keys: claves ya calculadas (por sal); con
  // «Recordar» se guardan en este navegador como claves NO exportables: la contraseña nunca se guarda.
  var st = { pws: [], keys: {}, remember: false, branches: [], centers: [], cur: 0, day: today(), msg: '', bad: '', loading: false, ready: false, lastCheck: null, cached: false, view: 'cols', scroll: null };
  try { if (localStorage.getItem(LS_VW) === 'lista') st.view = 'lista'; } catch (e) { }

  /* ---------- claves guardadas en el navegador (IndexedDB) ---------- */
  function idb(mode, fn) {
    return new Promise(function (resolve) {
      try {
        var r = indexedDB.open('consentia-agenda', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('claves'); };
        r.onerror = function () { resolve(null); };
        r.onsuccess = function () {
          var db = r.result, out = null;
          try { var tx = db.transaction('claves', mode); out = fn(tx.objectStore('claves')); tx.oncomplete = function () { db.close(); resolve(out); }; tx.onerror = tx.onabort = function () { db.close(); resolve(null); }; }
          catch (e) { db.close(); resolve(null); }

      } catch (e) { resolve(null); }
    });
  }
  function loadKeys() {
    return idb('readonly', function (os) { var out = {}; var c = os.openCursor(); c.onsuccess = function () { var cur = c.result; if (cur) { if (cur.value && cur.value.type === 'secret') out[cur.key] = cur.value; cur.continue(); } }; return out; });
  }
  function saveKey(id, key) { if (st.remember) idb('readwrite', function (os) { os.put(key, id); }); }
  function clearKeys() { return idb('readwrite', function (os) { os.clear(); }); }

  function el(tag, attrs, kids) { var e = document.createElement(tag); if (attrs) Object.keys(attrs).forEach(function (k) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); }); else if (k === 'style') e.setAttribute('style', attrs[k]); else e.setAttribute(k, attrs[k]); }); (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }); return e; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(k, n) { var p = k.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function longDay(k) { var p = String(k).split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); var t = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }); return t.charAt(0).toUpperCase() + t.slice(1); }
  function ago(iso) { var m = Math.round((Date.now() - Date.parse(iso)) / 60000); if (!(m >= 0)) return ''; if (m < 1) return 'ahora mismo'; if (m < 60) return 'hace ' + m + ' min'; var h = Math.floor(m / 60); if (h < 48) return 'hace ' + h + ' h'; return 'hace ' + Math.floor(h / 24) + ' días'; }
  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function color(c) { return /^#[0-9a-f]{6}$/i.test(String(c || '')) ? c : '#999999'; }
  function txt(v, n) { return String(v == null ? '' : v).slice(0, n || 200); }
  function mins(t) { var m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? Math.min(1440, +m[1] * 60 + +m[2]) : 0; }
  function hm(m) { m = Math.round(m); return pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60); }
  function dow(k) { var p = String(k).split('-'); return (new Date(+p[0], +p[1] - 1, +p[2]).getDay() + 6) % 7; } // 0 = lunes
  function tint(c, a) { var n = parseInt(c.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  // Tramos de horario [[inicio, fin], …] en minutos. null = esta agenda no trae horarios (publicada con una versión anterior).
  function rg(v) { if (!Array.isArray(v)) return null; var out = []; for (var i = 0; i < v.length && out.length < 6; i++) { var a = +(v[i] || [])[0], b = +(v[i] || [])[1]; if (a >= 0 && b <= 1440 && b > a) out.push([Math.round(a), Math.round(b)]); } return out; }
  function centerRanges(d, day) { return Array.isArray(d.hours) ? rg(d.hours[dow(day)]) || [] : null; }
  function empRanges(d, e, day) {
    if (!Array.isArray(d.hours)) return null; if (e.id === '__sin') return centerRanges(d, day);
    var x = e.x && e.x[day]; if (x !== undefined && x !== null) return rg(x) || [];
    var s = e.sch && e.sch[dow(day)]; if (s !== undefined && s !== null) return rg(s) || [];
    return centerRanges(d, day);
  }
  // Un bloqueo en ese día: de qué minuto a qué minuto (dentro de lo que se pinta).
  function blockSpan(b, day, a0, a1) { var f = String(b.from), t = String(b.to); return [b.all || f.slice(0, 10) < day ? a0 : Math.max(a0, mins(f.slice(11, 16))), b.all || t.slice(0, 10) > day ? a1 : Math.min(a1, mins(t.slice(11, 16)) || a1)]; }
  // Reparte las citas que se pisan en «carriles», una al lado de otra (igual que el programa).
  function lanes(items) {
    items.sort(function (x, y) { return x.s - y.s || y.e - x.e; });
    var group = [], end = -1; function flush() { var n = 1; group.forEach(function (g) { n = Math.max(n, g.lane + 1); }); group.forEach(function (g) { g.lanes = n; }); group = []; }
    items.forEach(function (it) {
      if (it.s >= end && group.length) flush();
      var used = {}; group.forEach(function (g) { if (g.e > it.s) used[g.lane] = true; }); var lane = 0; while (used[lane]) lane++;
      it.lane = lane; group.push(it); end = Math.max(end, it.e);
    });
    if (group.length) flush(); return items;
  }
  function stateTag(a) { return a.st === 'c' ? el('span', { class: 'tag c', text: 'Cobrada' }) : a.st === 'h' ? el('span', { class: 'tag c', text: 'Hecha' }) : a.st === 'x' ? el('span', { class: 'tag x', text: 'Cancelada' }) : a.st === 'n' ? el('span', { class: 'tag n', text: 'No vino' }) : null; }
  // Ficha que sube desde abajo (el detalle de una cita o de un bloqueo, o las canceladas del día).
  function sheet(kids) {
    var old = document.querySelector('.sheetBack'); if (old) old.remove();
    var back = el('div', { class: 'sheetBack' }); var close = function () { back.remove(); };
    back.appendChild(el('div', { class: 'sheet', id: 'ficha' }, kids.concat([el('button', { text: 'Cerrar', on: { click: close } })])));
    back.addEventListener('click', function (e) { if (e.target === back) close(); });
    document.body.appendChild(back);
  }
  function apptSheet(a, who) { sheet([el('div', { class: 'h', text: txt(a.s, 5) + '–' + txt(a.e, 5) }), el('h2', {}, [txt(a.c, 80) || 'Sin clienta', stateTag(a)]), el('div', { class: 'who', text: who }), a.sv ? el('p', { text: txt(a.sv, 200) }) : null]); }
  function fitGrid() { var g = app.querySelector('.gw'); if (g) g.style.height = Math.max(260, window.innerHeight - g.getBoundingClientRect().top) + 'px'; }

  function kdfOf(file) {
    if (!file || file.format !== FORMAT || !file.kdf || file.kdf.alg !== 'PBKDF2-SHA256' || typeof file.kdf.salt !== 'string') throw new Error('formato');

  }
  async function deriveKey(pw, k) {

  }
  async function decryptWith(file, key) {

    return JSON.parse(new TextDecoder().decode(plain));
  }
  // Abre un archivo con una clave ya conocida o con alguna de las contraseñas escritas.
  async function openFile(file) {
    var k; try { k = kdfOf(file); } catch (e) { return null; }
    if (st.keys[k.id]) { try { return await decryptWith(file, st.keys[k.id]); } catch (e) { } }
    for (var i = 0; i < st.pws.length; i++) {
      try { var key = await deriveKey(st.pws[i], k); var data = await decryptWith(file, key); st.keys[k.id] = key; saveKey(k.id, key); return data; } catch (e) { }
    }
    return null;
  }
  async function getJson(url) { var r = await fetch(url, { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' }); if (r.status === 404) return null; if (!r.ok) { var e = new Error('http ' + r.status); e.status = r.status; throw e; } return r.json(); }

  // Agendas publicadas (una rama «agenda-…» por centro): la lista, por la API de GitHub (al momento). Si GitHub
  // limita las consultas (muchas seguidas desde la misma conexión), se leen las ramas ya conocidas de
  // raw.githubusercontent.com, que puede ir unos minutos por detrás.
  function knownBranches() { try { return JSON.parse(localStorage.getItem(LS_BR) || '[]').filter(function (b) { return BR_RE.test(b); }); } catch (e) { return []; } }
  async function listing() {
    try {
      var refs = await getJson(cfg.api + '/repos/' + cfg.repo + '/git/matching-refs/heads/agenda-');
      var items = (refs || []).map(function (r) { return { key: String(r.ref).replace('refs/heads/', ''), sha: r.object && r.object.sha }; }).filter(function (x) { return BR_RE.test(x.key) && SHA_RE.test(x.sha || ''); });
      st.branches = items.map(function (x) { return x.key; });
      if (st.remember) { try { localStorage.setItem(LS_BR, JSON.stringify(st.branches)); } catch (e) { } }
      return { items: items.map(function (x) { return { key: x.key, sha: x.sha, url: cfg.raw + '/' + cfg.repo + '/' + x.sha + '/agenda.json' }; }) };
    } catch (e) {
      if (!(e.status === 403 || e.status === 429)) throw e;
      var names = st.branches.length ? st.branches : knownBranches();
      if (!names.length) { var err = new Error('limite'); err.limit = true; throw err; }
      return { cached: true, items: names.map(function (b) { return { key: b, sha: null, url: cfg.raw + '/' + cfg.repo + '/' + b + '/agenda.json' }; }) };
    }
